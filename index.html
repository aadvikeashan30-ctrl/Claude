<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Super Mario - Classic Edition</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
#ui-overlay {
  position: fixed; top: 0; left: 0; width: 100%; padding: 10px 20px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: 'Courier New', monospace; font-size: 18px; color: #fff;
  text-shadow: 2px 2px 0 #000; z-index: 10; pointer-events: none;
}
#ui-overlay div { background: rgba(0,0,0,0.4); padding: 5px 12px; border-radius: 4px; }
#game-over-screen, #start-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  background: rgba(0,0,0,0.85); z-index: 100; font-family: 'Courier New', monospace; color: #fff;
}
#game-over-screen h1 { font-size: 48px; color: #e74c3c; margin-bottom: 20px; text-shadow: 3px 3px 0 #000; }
#start-screen h1 { font-size: 42px; color: #f39c12; margin-bottom: 10px; text-shadow: 3px 3px 0 #000; }
#start-screen h2 { font-size: 20px; color: #ecf0f1; margin-bottom: 30px; }
.btn {
  padding: 15px 40px; font-size: 22px; font-family: 'Courier New', monospace;
  background: #27ae60; color: #fff; border: none; border-radius: 8px; cursor: pointer;
  text-shadow: 1px 1px 0 #000; pointer-events: all; margin-top: 15px;
}
.btn:hover { background: #2ecc71; }
#score-display { font-size: 24px; margin-bottom: 10px; }
#mobile-controls { position:fixed;bottom:20px;left:0;width:100%;display:none;z-index:50;pointer-events:none; }
</style>
</head>
<body>
<div id="start-screen">
  <h1>SUPER MARIO</h1>
  <h2>Classic Edition</h2>
  <p style="color:#bdc3c7;margin-bottom:20px;">Desktop: Arrow Keys / WASD + Space</p>
  <p style="color:#bdc3c7;margin-bottom:20px;">Mobile: Touch Controls</p>
  <button class="btn" id="start-btn">START GAME</button>
</div>
<div id="game-over-screen" style="display:none;">
  <h1>GAME OVER</h1>
  <div id="score-display">Score: 0</div>
  <button class="btn" id="restart-btn">PLAY AGAIN</button>
</div>
<div id="ui-overlay" style="display:none;">
  <div id="hud-score">SCORE: 0</div>
  <div id="hud-coins">COINS: 0</div>
  <div id="hud-lives">LIVES: 3</div>
</div>
<canvas id="gameCanvas"></canvas>

<div id="mobile-controls">
  <div style="display:flex;justify-content:space-between;padding:0 20px;pointer-events:none;">
    <div style="display:flex;gap:10px;pointer-events:all;">
      <button id="btn-left" style="width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,0.3);border:2px solid rgba(255,255,255,0.5);font-size:24px;color:#fff;">&#9664;</button>
      <button id="btn-right" style="width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,0.3);border:2px solid rgba(255,255,255,0.5);font-size:24px;color:#fff;">&#9654;</button>
    </div>
    <div style="pointer-events:all;">
      <button id="btn-jump" style="width:80px;height:80px;border-radius:50%;background:rgba(255,200,0,0.4);border:2px solid rgba(255,200,0,0.6);font-size:18px;color:#fff;font-weight:bold;">JUMP</button>
    </div>
  </div>
</div>
<script>
// ===== AUDIO ENGINE =====
class AudioEngine {
  constructor() { this.ctx = null; this.initialized = false; }
  init() {
    if (this.initialized) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.initialized = true; } catch(e) {}
  }
  playTone(freq, duration, type='square', volume=0.15) {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + duration);
  }
  jump() { this.playTone(400, 0.1); setTimeout(() => this.playTone(600, 0.1), 50); }
  coin() { this.playTone(988, 0.08); setTimeout(() => this.playTone(1319, 0.15), 80); }
  stomp() { this.playTone(200, 0.15, 'sawtooth', 0.2); }
  die() { this.playTone(400,0.2,'square',0.2); setTimeout(()=>this.playTone(300,0.2,'square',0.2),200); setTimeout(()=>this.playTone(200,0.3,'square',0.2),400); }
  brick() { this.playTone(150, 0.08, 'triangle', 0.2); }
  powerup() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.playTone(f,0.1,'square',0.12),i*80)); }
  gameover() { [392,349,330,294,262].forEach((f,i)=>setTimeout(()=>this.playTone(f,0.25,'square',0.2),i*200)); }
}
const audio = new AudioEngine();

// ===== CONSTANTS =====
const TILE = 32;
const GRAVITY = 0.6;
const FRICTION = 0.85;
const MAX_SPEED = 5;
const JUMP_FORCE = -12;
const ENEMY_SPEED = 1.2;
const CANVAS = document.getElementById('gameCanvas');
const CTX = CANVAS.getContext('2d');

// ===== LEVEL GENERATION =====
function generateLevel() {
  const width = 200, height = 14;
  const map = [];
  for (let y = 0; y < height; y++) { map[y] = []; for (let x = 0; x < width; x++) map[y][x] = y >= 12 ? 1 : 0; }
  // Gaps
  [[15,17],[38,40],[62,64],[95,97],[130,132],[160,162]].forEach(([s,e]) => { for(let x=s;x<=e;x++){map[12][x]=0;map[13][x]=0;} });
  // Brick rows
  [[8,12,7],[22,26,7],[45,50,7],[70,75,7],[100,106,7],[135,140,7],[165,170,7]].forEach(([s,e,y]) => { for(let x=s;x<=e;x++) map[y][x]=2; });
  // Question blocks
  [[10,7],[24,7],[48,7],[73,7],[103,7],[138,7],[168,7],[12,4],[50,4],[105,4]].forEach(([x,y]) => map[y][x]=3);
  // Floating platforms
  [[30,9,4],[55,9,3],[85,8,5],[115,9,4],[145,8,3],[175,9,4]].forEach(([x,y,len]) => { for(let i=0;i<len;i++) map[y][x+i]=2; });
  // Pipes
  [[20,10],[42,10],[68,10],[90,9],[120,10],[150,10],[180,10]].forEach(([x,y]) => { for(let py=y;py<12;py++){map[py][x]=4;map[py][x+1]=4;} });
  // Flag
  map[5][195]=5; for(let y=6;y<12;y++) map[y][195]=5;
  return { map, width, height };
}

// ===== GAME STATE =====
let game = { running:false, score:0, coins:0, lives:3, camera:{x:0,y:0}, level:null, entities:[], particles:[], time:0, won:false };
let player = { x:80, y:320, vx:0, vy:0, width:24, height:30, onGround:false, facing:1, frame:0, frameTimer:0, invincible:0, dead:false };
let keys = { left:false, right:false, jump:false };

// ===== ENTITIES =====
class Goomba { constructor(x,y){this.x=x;this.y=y;this.vx=-ENEMY_SPEED;this.vy=0;this.width=28;this.height=28;this.alive=true;this.squished=0;this.type='goomba';} }
class Coin { constructor(x,y){this.x=x;this.y=y;this.width=20;this.height=24;this.collected=false;this.type='coin';this.frame=0;this.timer=0;} }
class Particle { constructor(x,y,vx,vy,color,life){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.color=color;this.life=life;this.maxLife=life;} }

function spawnEntities() {
  game.entities = [];
  [12,25,35,47,58,66,75,82,93,102,110,118,128,137,148,155,165,173,183,190].forEach(x => game.entities.push(new Goomba(x*TILE, 11*TILE-28)));
  [[9,6],[11,6],[24,6],[25,6],[47,6],[49,6],[72,6],[74,6],[102,6],[104,6],[137,6],[139,6],[167,6],[169,6],
   [31,8],[32,8],[56,8],[86,8],[87,8],[116,8],[117,8],[146,8],[176,8],[177,8]].forEach(([x,y]) => game.entities.push(new Coin(x*TILE+6,y*TILE+4)));
}

// ===== COLLISION =====
function getTile(x, y) {
  const tx = Math.floor(x/TILE), ty = Math.floor(y/TILE);
  if (tx<0||tx>=game.level.width||ty<0||ty>=game.level.height) return 0;
  return game.level.map[ty][tx];
}
function isSolid(t) { return t===1||t===2||t===3||t===4; }
function rectCollide(a,b) { return a.x<b.x+b.width&&a.x+a.width>b.x&&a.y<b.y+b.height&&a.y+a.height>b.y; }

// ===== PLAYER PHYSICS =====
function updatePlayer() {
  if (player.dead) { player.vy+=GRAVITY; player.y+=player.vy; return; }
  if (keys.left) { player.vx-=0.5; player.facing=-1; }
  if (keys.right) { player.vx+=0.5; player.facing=1; }
  if (!keys.left&&!keys.right) player.vx*=FRICTION;
  player.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, player.vx));
  if (keys.jump && player.onGround) { player.vy=JUMP_FORCE; player.onGround=false; audio.jump(); }
  player.vy += GRAVITY;
  if (player.vy>15) player.vy=15;
  // Animation
  if (Math.abs(player.vx)>0.5 && player.onGround) { player.frameTimer++; if(player.frameTimer>6){player.frame=(player.frame+1)%3;player.frameTimer=0;} }
  else if (player.onGround) player.frame=0;
  // Move & collide
  player.x += player.vx; resolveHorizontal();
  player.y += player.vy; resolveVertical();
  if (player.invincible>0) player.invincible--;
  if (player.y > game.level.height*TILE+100) playerDie();
  // Win
  if (getTile(player.x+player.width/2, player.y+player.height/2)===5) {
    game.won=true; game.score+=1000; audio.powerup();
    setTimeout(()=>showGameOver(true),1500); game.running=false;
  }
}

function resolveHorizontal() {
  const left=Math.floor(player.x/TILE), right=Math.floor((player.x+player.width)/TILE);
  const top=Math.floor(player.y/TILE), bottom=Math.floor((player.y+player.height-1)/TILE);
  for(let ty=top;ty<=bottom;ty++) for(let tx=left;tx<=right;tx++) {
    if(isSolid(getTile(tx*TILE,ty*TILE))) {
      if(player.vx>0){player.x=tx*TILE-player.width;player.vx=0;}
      else if(player.vx<0){player.x=(tx+1)*TILE;player.vx=0;}
    }
  }
  if(player.x<0){player.x=0;player.vx=0;}
}

function resolveVertical() {
  player.onGround=false;
  const left=Math.floor(player.x/TILE), right=Math.floor((player.x+player.width-1)/TILE);
  const top=Math.floor(player.y/TILE), bottom=Math.floor((player.y+player.height)/TILE);
  for(let ty=top;ty<=bottom;ty++) for(let tx=left;tx<=right;tx++) {
    const tile=getTile(tx*TILE,ty*TILE);
    if(isSolid(tile)) {
      if(player.vy>0){player.y=ty*TILE-player.height;player.vy=0;player.onGround=true;}
      else if(player.vy<0){player.y=(ty+1)*TILE;player.vy=0;hitBlock(tx,ty,tile);}
    }
  }
}

function hitBlock(tx,ty,tile) {
  audio.brick();
  if(tile===3){game.level.map[ty][tx]=2;game.score+=100;game.coins++;audio.coin();spawnParticles(tx*TILE+16,ty*TILE,'#FFD700',5);updateHUD();}
  else if(tile===2){spawnParticles(tx*TILE+16,ty*TILE+16,'#8B4513',4);}
}

// ===== ENEMY & COIN LOGIC =====
function updateEntities() {
  game.entities.forEach(e => {
    if (e.type==='goomba'&&e.alive) {
      e.vy+=GRAVITY*0.5; e.x+=e.vx; e.y+=e.vy;
      const gB=Math.floor((e.y+e.height)/TILE),gL=Math.floor(e.x/TILE),gR=Math.floor((e.x+e.width)/TILE);
      for(let tx=gL;tx<=gR;tx++) if(isSolid(getTile(tx*TILE,gB*TILE))){e.y=gB*TILE-e.height;e.vy=0;}
      if(isSolid(getTile(e.x-2,e.y+e.height/2))) e.vx=ENEMY_SPEED;
      if(isSolid(getTile(e.x+e.width+2,e.y+e.height/2))) e.vx=-ENEMY_SPEED;
      if(e.y>game.level.height*TILE+50) e.alive=false;
      if(!player.dead&&player.invincible<=0&&rectCollide(player,e)) {
        if(player.vy>0&&player.y+player.height-e.y<20) {
          e.squished=30;e.alive=false;player.vy=-8;game.score+=200;audio.stomp();
          spawnParticles(e.x+e.width/2,e.y,'#8B4513',3);updateHUD();
        } else { playerDie(); }
      }
    } else if(e.type==='goomba'&&e.squished>0) { e.squished--; }
    if(e.type==='coin'&&!e.collected) {
      e.timer++;if(e.timer>8){e.frame=(e.frame+1)%4;e.timer=0;}
      if(!player.dead&&rectCollide(player,e)){e.collected=true;game.score+=50;game.coins++;audio.coin();spawnParticles(e.x+10,e.y+12,'#FFD700',4);updateHUD();}
    }
  });
}

// ===== PARTICLES =====
function spawnParticles(x,y,color,count) {
  for(let i=0;i<count;i++) game.particles.push(new Particle(x,y,(Math.random()-0.5)*6,-Math.random()*5-2,color,30+Math.random()*20));
}
function updateParticles() {
  game.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life--;});
  game.particles=game.particles.filter(p=>p.life>0);
}

// ===== DEATH & RESPAWN =====
function playerDie() {
  if(player.invincible>0||player.dead) return;
  player.dead=true;player.vy=-10;audio.die();game.lives--;
  setTimeout(()=>{if(game.lives<=0){audio.gameover();setTimeout(()=>showGameOver(false),500);}else{respawnPlayer();}},1500);
}
function respawnPlayer() {
  player.x=80;player.y=320;player.vx=0;player.vy=0;player.dead=false;player.onGround=false;player.invincible=120;
  game.camera.x=0;updateHUD();
}

// ===== CAMERA =====
function updateCamera() {
  const targetX=player.x-CANVAS.width/3;
  game.camera.x+=(targetX-game.camera.x)*0.08;
  if(game.camera.x<0)game.camera.x=0;
  const maxCam=game.level.width*TILE-CANVAS.width;
  if(game.camera.x>maxCam)game.camera.x=maxCam;
}

// ===== RENDERING =====
function render() {
  const W=CANVAS.width,H=CANVAS.height;
  const grad=CTX.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#5c94fc');grad.addColorStop(0.7,'#87CEEB');grad.addColorStop(1,'#c8e6ff');
  CTX.fillStyle=grad;CTX.fillRect(0,0,W,H);
  // Clouds
  CTX.fillStyle='rgba(255,255,255,0.8)';
  for(let i=0;i<15;i++){const cx=(i*450+100)-game.camera.x*0.3,cy=40+(i%3)*35;if(cx>-100&&cx<W+100){CTX.beginPath();CTX.ellipse(cx,cy,40,20,0,0,Math.PI*2);CTX.ellipse(cx+30,cy-5,30,18,0,0,Math.PI*2);CTX.ellipse(cx-25,cy+3,28,16,0,0,Math.PI*2);CTX.fill();}}
  // Hills
  CTX.fillStyle='#4a8c3f';
  for(let i=0;i<10;i++){const hx=(i*600)-game.camera.x*0.4;if(hx>-200&&hx<W+200){CTX.beginPath();CTX.ellipse(hx,H-60,120+i*10,50+i*5,0,0,Math.PI,true);CTX.fill();}}
  // Bushes
  CTX.fillStyle='#2d6b2d';
  for(let i=0;i<20;i++){const bx=(i*320+50)-game.camera.x*0.6;if(bx>-80&&bx<W+80){CTX.beginPath();CTX.ellipse(bx,H-68,35,18,0,0,Math.PI,true);CTX.ellipse(bx+25,H-68,25,14,0,0,Math.PI,true);CTX.fill();}}
  CTX.save();CTX.translate(-game.camera.x,0);
  renderTiles();renderEntities();renderPlayer();renderParticles();
  CTX.restore();
}

function renderTiles() {
  const startX=Math.floor(game.camera.x/TILE),endX=startX+Math.ceil(CANVAS.width/TILE)+2;
  for(let y=0;y<game.level.height;y++) for(let x=startX;x<endX&&x<game.level.width;x++) {
    const tile=game.level.map[y][x],px=x*TILE,py=y*TILE;
    if(tile===1){
      CTX.fillStyle='#c84c0c';CTX.fillRect(px,py,TILE,TILE);
      CTX.fillStyle='#e09050';CTX.fillRect(px+2,py+2,TILE-4,8);
      CTX.strokeStyle='#6b3008';CTX.lineWidth=1;CTX.strokeRect(px+0.5,py+0.5,TILE-1,TILE-1);
    } else if(tile===2){
      CTX.fillStyle='#c84c0c';CTX.fillRect(px,py,TILE,TILE);
      CTX.fillStyle='#e09050';CTX.fillRect(px+2,py+2,12,12);CTX.fillRect(px+18,py+2,12,12);CTX.fillRect(px+2,py+18,12,12);CTX.fillRect(px+18,py+18,12,12);
      CTX.strokeStyle='#6b3008';CTX.lineWidth=1;CTX.strokeRect(px+0.5,py+0.5,TILE-1,TILE-1);
    } else if(tile===3){
      CTX.fillStyle='#f5a623';CTX.fillRect(px,py,TILE,TILE);
      CTX.fillStyle='#ffd700';CTX.fillRect(px+3,py+3,TILE-6,TILE-6);
      CTX.fillStyle='#c84c0c';CTX.font='bold 18px Courier';CTX.textAlign='center';CTX.fillText('?',px+TILE/2,py+TILE/2+6);
      CTX.strokeStyle='#8B4513';CTX.lineWidth=2;CTX.strokeRect(px+1,py+1,TILE-2,TILE-2);
    } else if(tile===4){
      CTX.fillStyle='#2d8b2d';CTX.fillRect(px,py,TILE,TILE);
      CTX.fillStyle='#4ade4a';CTX.fillRect(px+4,py,8,TILE);
      CTX.strokeStyle='#1a5c1a';CTX.lineWidth=1;CTX.strokeRect(px+0.5,py+0.5,TILE-1,TILE-1);
    } else if(tile===5){
      CTX.fillStyle='#666';CTX.fillRect(px+14,py,4,TILE);
      if(y===5){CTX.fillStyle='#e74c3c';CTX.fillRect(px+18,py+4,20,14);}
    }
  }
}

function renderPlayer() {
  if(player.invincible>0&&Math.floor(player.invincible/4)%2===0) return;
  const px=player.x,py=player.y,f=player.facing;
  CTX.save();
  if(f===-1){CTX.translate(px+player.width/2,0);CTX.scale(-1,1);CTX.translate(-(px+player.width/2),0);}
  // Hat
  CTX.fillStyle='#e74c3c';CTX.fillRect(px+4,py,18,8);CTX.fillRect(px+2,py+3,22,5);
  // Face
  CTX.fillStyle='#fdbcb4';CTX.fillRect(px+4,py+8,16,10);
  // Eyes
  CTX.fillStyle='#000';CTX.fillRect(px+12,py+10,3,3);
  // Mustache
  CTX.fillStyle='#4a2800';CTX.fillRect(px+8,py+15,10,3);
  // Body
  CTX.fillStyle='#0066cc';CTX.fillRect(px+4,py+18,16,8);
  CTX.fillStyle='#e74c3c';CTX.fillRect(px+6,py+18,12,4);
  // Legs
  if(!player.onGround){CTX.fillStyle='#0066cc';CTX.fillRect(px+4,py+26,6,4);CTX.fillRect(px+14,py+24,6,4);}
  else if(Math.abs(player.vx)>0.5){const lo=player.frame===1?2:0;CTX.fillStyle='#0066cc';CTX.fillRect(px+4,py+26,6,4+lo);CTX.fillRect(px+14,py+26,6,6-lo);}
  else{CTX.fillStyle='#0066cc';CTX.fillRect(px+4,py+26,6,4);CTX.fillRect(px+14,py+26,6,4);}
  // Shoes
  CTX.fillStyle='#5c3317';CTX.fillRect(px+2,py+28,8,3);CTX.fillRect(px+14,py+28,8,3);
  CTX.restore();
}

function renderEntities() {
  game.entities.forEach(e => {
    if(e.type==='goomba') {
      if(e.squished>0){CTX.fillStyle='#8B4513';CTX.fillRect(e.x,e.y+e.height-8,e.width,8);return;}
      if(!e.alive) return;
      CTX.fillStyle='#8B4513';CTX.beginPath();CTX.ellipse(e.x+14,e.y+10,14,10,0,0,Math.PI*2);CTX.fill();
      const wobble=Math.sin(game.time*0.15)*2;
      CTX.fillStyle='#4a2800';CTX.fillRect(e.x+2,e.y+20,10,8+wobble);CTX.fillRect(e.x+16,e.y+20,10,8-wobble);
      CTX.fillStyle='#fff';CTX.fillRect(e.x+6,e.y+6,6,7);CTX.fillRect(e.x+16,e.y+6,6,7);
      CTX.fillStyle='#000';CTX.fillRect(e.x+8,e.y+8,3,4);CTX.fillRect(e.x+18,e.y+8,3,4);
      CTX.fillStyle='#4a2800';CTX.fillRect(e.x+5,e.y+4,8,2);CTX.fillRect(e.x+15,e.y+4,8,2);
    }
    if(e.type==='coin'&&!e.collected) {
      const bounce=Math.sin(game.time*0.1+e.x)*3;
      CTX.fillStyle='#FFD700';CTX.beginPath();
      const sx=[1,0.6,0.2,0.6][e.frame];
      CTX.ellipse(e.x+10,e.y+12+bounce,8*sx,10,0,0,Math.PI*2);CTX.fill();
      CTX.fillStyle='#FFA500';CTX.beginPath();CTX.ellipse(e.x+10,e.y+12+bounce,4*sx,6,0,0,Math.PI*2);CTX.fill();
    }
  });
}

function renderParticles() {
  game.particles.forEach(p=>{const alpha=p.life/p.maxLife;CTX.fillStyle=p.color;CTX.globalAlpha=alpha;CTX.fillRect(p.x-3,p.y-3,6,6);});
  CTX.globalAlpha=1;
}

// ===== HUD =====
function updateHUD() {
  document.getElementById('hud-score').textContent='SCORE: '+game.score;
  document.getElementById('hud-coins').textContent='COINS: '+game.coins;
  document.getElementById('hud-lives').textContent='LIVES: '+game.lives;
}

// ===== GAME LOOP =====
function gameLoop() {
  if(!game.running) return;
  game.time++;
  updatePlayer();updateEntities();updateParticles();updateCamera();render();
  requestAnimationFrame(gameLoop);
}

// ===== RESIZE =====
function resize(){CANVAS.width=window.innerWidth;CANVAS.height=window.innerHeight;}
window.addEventListener('resize',resize);

// ===== INPUT =====
document.addEventListener('keydown',e=>{
  audio.init();
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;
  if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space'){keys.jump=true;e.preventDefault();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
  if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space')keys.jump=false;
});

// Mobile
function setupMobile(){
  if('ontouchstart' in window) document.getElementById('mobile-controls').style.display='block';
  const bl=document.getElementById('btn-left'),br=document.getElementById('btn-right'),bj=document.getElementById('btn-jump');
  bl.addEventListener('touchstart',e=>{e.preventDefault();keys.left=true;audio.init();});
  bl.addEventListener('touchend',e=>{e.preventDefault();keys.left=false;});
  br.addEventListener('touchstart',e=>{e.preventDefault();keys.right=true;audio.init();});
  br.addEventListener('touchend',e=>{e.preventDefault();keys.right=false;});
  bj.addEventListener('touchstart',e=>{e.preventDefault();keys.jump=true;audio.init();});
  bj.addEventListener('touchend',e=>{e.preventDefault();keys.jump=false;});
}

// ===== GAME MANAGEMENT =====
function startGame(){
  document.getElementById('start-screen').style.display='none';
  document.getElementById('game-over-screen').style.display='none';
  document.getElementById('ui-overlay').style.display='flex';
  game.level=generateLevel();game.score=0;game.coins=0;game.lives=3;
  game.camera.x=0;game.particles=[];game.running=true;game.won=false;game.time=0;
  player.x=80;player.y=320;player.vx=0;player.vy=0;player.dead=false;player.onGround=false;player.invincible=0;
  spawnEntities();updateHUD();resize();gameLoop();
}

function showGameOver(won){
  game.running=false;
  const s=document.getElementById('game-over-screen');s.style.display='flex';
  s.querySelector('h1').textContent=won?'YOU WIN!':'GAME OVER';
  s.querySelector('h1').style.color=won?'#27ae60':'#e74c3c';
  document.getElementById('score-display').textContent='Score: '+game.score;
}

document.getElementById('start-btn').addEventListener('click',()=>{audio.init();startGame();});
document.getElementById('restart-btn').addEventListener('click',()=>{audio.init();startGame();});
document.getElementById('start-btn').addEventListener('touchstart',e=>{e.preventDefault();audio.init();startGame();});
document.getElementById('restart-btn').addEventListener('touchstart',e=>{e.preventDefault();audio.init();startGame();});

resize();setupMobile();
</script>
</body>
</html>
